<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=width=1280">
<title>งานวิจัย | MGMU</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&family=Noto+Serif+Thai:wght@700&display=swap" rel="stylesheet" />
<style>
:root{--navy:#0d1b36;--gold:#c9a86a;--gold2:#e9c77a}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Sarabun",sans-serif;background:#fff}
a{text-decoration:none;color:inherit}
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 24px}
.logo-wrap{display:flex;align-items:center;gap:12px}.logo-wrap img{height:54px}
.logo-text strong{font-family:"Noto Serif Thai",serif;font-size:18px;display:block}
.logo-text span{font-size:11px;opacity:.8;display:block;margin-top:-4px}
.nav{display:flex;gap:22px;font-size:14px}.nav a.active{border-bottom:2px solid var(--gold);color:var(--gold2)}
.btn-gold{background:var(--gold);color:var(--navy);padding:6px 16px;border-radius:20px;font-weight:700;font-size:13px}
.hero{position:relative;height:260px;background:var(--navy);overflow:hidden;display:grid;place-items:center}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4}
.hero-content{position:relative;z-index:2;text-align:center;color:#fff}
.hero-content h1{font-size:32px;font-family:"Noto Serif Thai",serif}
.wrap{max-width:1280px;margin:0 auto;padding:32px 24px}
.search-bar{background:#fff;border:1px solid #e6e6e6;border-radius:10px;padding:12px;display:flex;gap:10px;margin-bottom:20px}
.search-bar input{flex:1;border:1px solid #e6e6e6;border-radius:8px;padding:10px 14px;font-family:"Sarabun"}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid #e6e6e6;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(13,27,54,.06)}
.card .body{padding:16px}.card b{font-size:15px;color:var(--navy);display:block}.card small{font-size:12px;opacity:.6}.card p{font-size:13px;opacity:.7;margin-top:6px}
.btn-pdf{background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:inline-block;margin-top:10px}
</style>
<link rel="stylesheet" href="phone.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="logo-wrap" href="index.html"><img src="mgmu.png"><div class="logo-text"><strong>MGMU</strong><span>METROPOLITAN GUARDIAN MEDICAL UNIVERSITY</span></div></a><nav class="nav"><a href="index.html">หน้าแรก</a><a href="คณะ.html">คณะวิชา</a><a href="งานวิจัย.html" class="active">งานวิจัย</a></nav><a class="btn-gold" href="login.html">เข้าสู่ระบบ</a></div></header>
<section class="hero"><img class="hero-bg" src="mgmu_town.png" onerror="this.src='mgmu.png'"><div class="hero-content"><h1>งานวิจัย</h1><p>ไฟล์ PDF จากแอดมิน</p></div></section>
<div class="wrap"><div class="search-bar"><input id="q" placeholder="ค้นหางานวิจัย..."></div><div class="grid" id="list"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCg8IN6QUb4O3TAk-kGkoiefxGsezw1dPE",authDomain:"mgmu-7ac39.firebaseapp.com",projectId:"mgmu-7ac39",storageBucket:"mgmu-7ac39.firebasestorage.app",messagingSenderId:"371565700622",appId:"1:371565700622:web:382d7a4a695daa2b1dfe5f"});
const db=getFirestore(app);
let all=[];
onSnapshot(query(collection(db,"research"),orderBy("createdAt","desc")),snap=>{
all=snap.docs.map(d=>({id:d.id,...d.data()}));
render();
});
function render(){
const q=document.getElementById('q').value.toLowerCase();
let f=all.filter(x=> !q || (x.title+x.author+x.faculty+x.desc).toLowerCase().includes(q));
const el=document.getElementById('list');
if(f.length===0){ el.innerHTML='<p style="opacity:.5">ยังไม่มีงานวิจัย</p>'; return; }
el.innerHTML=f.map(x=>`
<div class="card">
<div class="body">
<span style="font-size:11px;background:#f4f6f9;padding:4px 8px;border-radius:20px">${x.faculty||''}</span>
<b>${x.title}</b>
<small>โดย ${x.author||'-'}</small>
<p>${x.desc||''}</p>
${x.pdfUrl?`<a class="btn-pdf" href="${x.pdfUrl}" target="_blank">📄 เปิด PDF</a> <a href="${x.pdfUrl}" download style="font-size:13px;color:#3b82f6;margin-left:8px">ดาวน์โหลด</a><iframe src="${x.pdfUrl}" style="width:100%;height:300px;border:none;margin-top:12px;border-radius:8px"></iframe>`:''}
</div>
</div>
`).join('');
}
document.getElementById('q').addEventListener('input',render);
</script>
</body>
</html>
